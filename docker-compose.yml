version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tradesense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradesense
      POSTGRES_PASSWORD: tradesense_secret_password
      POSTGRES_DB: tradesense_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradesense -d tradesense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradesense-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tradesense-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://tradesense:tradesense_secret_password@postgres:5432/tradesense_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=tradesense_super_secret_jwt_key_2026_fintech_secure
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tradesense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
